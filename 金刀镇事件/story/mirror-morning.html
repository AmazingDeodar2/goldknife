<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>镜子</title><link rel="stylesheet" href="../css/story.css"></head><body><main class="story"><div class="chapter">10 / 29 — 08:19</div>
<p>你拿纸巾把镜面上的痕迹擦掉。</p>
<p>没有血，没有裂纹，也没有从里面伸出来的手。只是普通的水汽。</p>
<p>抹布依旧不肯靠近。</p>
<div class="dialogue">“你昨天还敢踩我脸上，现在怕镜子？”</div>
<p>抹布往后退了一步。</p>
<div class="dialogue">“里面那个长得比我帅？”</div>
<p>它看着你。</p>
<div class="dialogue">“……行，这个反应有点伤人。”</div>
<p>你重新想起 Salem 昨晚最后那句。</p>
<div class="dialogue">“别对着镜子试。”</div>
<p>谁会闲得没事对着镜子催眠？</p>
<p>这个问题在脑子里停了几秒。</p>
<p>然后你突然发现，自己并不喜欢这个问题。</p>
<p>你打开缓存站，在搜索框里输入：<b>镜子</b>。</p>
