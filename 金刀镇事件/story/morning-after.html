<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../css/story.css"><title>早晨</title></head><body><main class="story"><div class="chapter">10 / 29 — MORNING</div><p>你醒得很突然。</p><p>抹布没有舔你。它站在房间中央，四条腿绷得很紧，盯着墙上的镜子。</p><p>你也看过去。</p><p>镜子里只有你自己。</p><p>至少第一眼是这样。</p><p>镜面上有一小块雾，像刚有人对着它呼过气。</p><p>雾气里有一道用手指划出来的痕迹。</p><p>不是字。</p><p>像一扇很窄的门。</p><div class="choice"><a href="mirror-morning.html">检查镜子 →</a></div></main><script src="../js/state.js"></script><script>ARG.flag("morning_after_seen")</script></body></html>
