<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>验证</title><link rel="stylesheet" href="../css/story.css"></head><body><main class="story"><div class="chapter">10 / 28 — CONTROL</div>
<p>你找了个完全不知道前几天发生过什么的人。</p><p>这次你连“安静的地方”都没说，只让对方闭眼以后描述脑子里第一个浮现的场景。</p>
<div class="dialogue">Pacey：“别猜我想听什么。我什么都不想听，你随便说。”<br><br>
“……白的。”<br><br>
“什么东西是白的？”<br><br>
“到处都是。应该是雪。”<br><br>
你靠回椅背：“好。继续。”<br><br>
“风很大。”<br><br>
“还有别的吗？”<br><br>
对方沉默了很久：“远处有人。”<br><br>
“男的女的？”<br><br>
“不知道。”<br><br>
“能看见什么？”<br><br>
“头发吧。”<br><br>
“什么颜色？”<br><br>
“红的。很红。”</div>
