<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>附件恢复：H. Mercer notebook / page 47</title><link rel="stylesheet" href="../css/site.css"></head><body><div class="site"><div class="cache">NORTHLAND CACHE // <a href="../archive.html" onclick="if(history.length>1){history.back();return false}">返回检索</a></div><header class="head"><h1>NORTHLAND ARCHIVE</h1></header><main class="content"><h2>附件恢复：H. Mercer notebook / page 47</h2><div class="quote">11/??<br><br>昨晚又梦到北边那块白地方。醒来时靴子是干的，所以至少这回我没真的出去。<br><br>下午碰见红头发那姑娘。我问是不是她又在搞那些梦。她说不是她，是“风在找缝”。<br><br>我说镇里孩子开始叫她女巫。她说如果我也这么叫，下次就不把我送回来。<br><br>她让我叫她 <b>Salem</b>。不知道是不是本名。<br><br>她还说：如果梦里听见有人从风里叫名字，别回答。</div><div class="note">页脚残句：“……门不是给人开的……”</div><a class="back" href="../archive.html" onclick="if(history.length>1){history.back();return false}">← 返回缓存检索</a></main></div><script src="../js/state.js"></script><script>ARG.flag("hunter_diary_seen");ARG.flag("salem_known")</script></body></html>
