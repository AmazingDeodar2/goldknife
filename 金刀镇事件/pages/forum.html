<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>北边森林的“红发女巫”到底是什么？</title><link rel="stylesheet" href="../css/site.css"></head><body><div class="site"><div class="cache">NORTHLAND CACHE // <a href="../archive.html" onclick="if(history.length>1){history.back();return false}">返回检索</a></div><header class="head"><h1>GOLDEN KNIFE ARCHIVE</h1></header><main class="content"><h2>北边森林的“红发女巫”到底是什么？</h2><div class="thread"><div class="post"><div class="user"><b>aurora_trip</b></div><div class="msg"><div class="date">21:04</div>导游今天讲了红发女巫。到底是本地传说还是旅游公司编的？</div></div><div class="post"><div class="user"><b>OldLake</b></div><div class="msg"><div class="date">21:19</div>小时候就有人讲，但没你们旅游册那么整齐。有人说红头发，有人说是老太太，还有人只说“林子里那个女人”。</div></div><div class="post"><div class="user"><b>moss_17</b></div><div class="msg"><div class="date">21:31</div>我奶奶最烦“女巫”这个叫法。她说城里人把宁格克的旧故事和几个失踪案揉到一起了。</div></div><div class="post"><div class="user"><b>NorthHunter</b></div><div class="msg"><div class="date">22:02</div>故事随便听。北边树上挂的东西别碰，这条是真的。</div></div></div><a class="back" href="../archive.html" onclick="if(history.length>1){history.back();return false}">← 返回缓存检索</a></main></div><script src="../js/state.js"></script><script>ARG.flag("ningek_known")</script></body></html>
