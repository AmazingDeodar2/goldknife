<h1>长梦</h1>
<p>你握住了那只手。</p>
<p>冷得出奇。</p>
<p>下一秒，旅馆、电脑、镜子和抹布的叫声全部退到很远的地方。</p>
<p>雪重新出现在脚下。</p>
<p>你知道自己只要愿意，随时可以醒。</p>
<p>至少最开始是这么想的。</p>
<p>后来你开始给自己重复一句更舒服的话：</p>
<div class="dialogue">“再睡一会儿。”</div>
<p>你很擅长催眠。</p>
<p>这一次也没有失败。</p>
<p>金刀镇的旅馆在第二天中午报警。房间里没有打斗痕迹，Pacey Acaloi 躺在床上，生命体征正常，却再也没有醒来。</p>
<p>抹布一直守在床边。</p>
