<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>金刀镇</title><link rel="stylesheet" href="css/story.css"></head><body><main class="story"><div class="chapter">AUTUMN / GOLDEN KNIFE</div><h1>金刀镇</h1><p>你是 <b>Pacey Acaloi</b>。</p><p>你和朋友来加拿大北部旅行，本来只准备在金刀镇停两天。结果天气很好，湖边也漂亮，你临时改了主意，让朋友先走。</p><p>你留下来。抹布也留下来——它对此没有发表意见，只是在你收拾行李的时候霸占了半个箱子。</p><p>你还会催眠。至少你一直这么说。</p><p>成功率大约百分之十。低得很，但对你来说已经足够制造不少有趣的晚上。</p><div class="choice"><a href="dream/dream01.html">第一晚 →</a></div></main><script src="js/state.js"></script></body></html>
