<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIDDEN ENDING — ANCHOR</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#fff;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}
#scene{position:fixed;inset:0;background:#02050a;isolation:isolate}
.bg{position:absolute;inset:-4%;background:url("../assets/salem_snowfield.png") center/cover no-repeat;
 transform:scale(1.08);filter:brightness(.48) saturate(.72);opacity:0;transition:opacity 2.4s ease,filter 3s ease,transform 9s ease}
.bg.on{opacity:1;transform:scale(1.01)}
.vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,transparent 30%,rgba(0,0,0,.38) 72%,rgba(0,0,0,.82) 100%);z-index:4;pointer-events:none}
.frost{position:absolute;inset:0;z-index:3;opacity:.45;mix-blend-mode:screen;
 background:linear-gradient(115deg,transparent 20%,rgba(185,222,255,.08) 48%,transparent 70%);animation:frost 7s ease-in-out infinite}
@keyframes frost{50%{transform:translateX(4%);opacity:.7}}
#salem{position:absolute;z-index:5;right:-17vw;bottom:-11vh;width:min(78vw,1260px);max-height:113vh;object-fit:contain;object-position:right bottom;
 opacity:0;filter:drop-shadow(0 0 28px rgba(130,170,210,.18));transform:translate(7%,4%) scale(.96);
 transition:opacity 1.8s ease,transform 2.8s cubic-bezier(.16,.84,.25,1),filter 2s ease}
#salem.on{opacity:1;transform:translate(0,0) scale(1)}
#salem.close{transform:translate(-2.5%,1%) scale(1.045);filter:drop-shadow(0 0 36px rgba(255,190,170,.18))}
.snow{position:absolute;z-index:6;top:-10vh;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.55;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(180deg)}}
#flash{position:absolute;inset:0;background:white;z-index:20;opacity:0;pointer-events:none}
#flash.hit{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:.72}100%{opacity:0}}
#dialogue{position:absolute;z-index:10;left:5vw;bottom:5vh;width:min(690px,89vw);min-height:150px;
 padding:22px 26px 20px;background:linear-gradient(100deg,rgba(4,8,14,.91),rgba(8,12,19,.76));
 border:1px solid rgba(210,228,245,.26);box-shadow:0 14px 50px rgba(0,0,0,.38);backdrop-filter:blur(7px);
 opacity:0;transform:translateY(15px);transition:.6s ease}
#dialogue.on{opacity:1;transform:none}
#name{font-size:13px;letter-spacing:.24em;color:#e9a3a3;margin-bottom:12px;text-transform:uppercase}
#text{font-size:18px;line-height:1.9;min-height:3.8em;text-shadow:0 1px 8px #000}
#next{position:absolute;right:18px;bottom:10px;font-size:11px;opacity:.42;letter-spacing:.14em}
#break{position:absolute;z-index:15;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
#break.show{animation:breakin 1.15s ease forwards}
@keyframes breakin{0%{opacity:0;transform:scale(1.08);filter:blur(10px)}45%{opacity:1;filter:blur(0)}100%{opacity:0}}
#birthday{position:absolute;z-index:14;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 opacity:0;pointer-events:none;text-shadow:0 2px 22px #000}
#birthday.on{animation:bday 2.2s ease forwards}
#birthday h1{font-weight:400;font-size:clamp(38px,6vw,86px);letter-spacing:.14em;margin:0 0 18px}
#birthday p{font-size:clamp(14px,1.6vw,21px);letter-spacing:.22em;opacity:.86}
@keyframes bday{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
#endui{position:absolute;z-index:30;right:24px;top:22px;opacity:0;transition:1s}
#endui.on{opacity:.55}
#endui a{color:#fff;text-decoration:none;font:12px Consolas,monospace;letter-spacing:.12em}
.glitch{animation:glitch .32s steps(2,end) 3}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(7px,-2px)}50%{transform:translate(-5px,3px)}75%{transform:translate(3px,1px)}100%{transform:translate(0)}}
@media(max-width:800px){
 #salem{width:125vw;right:-48vw;bottom:-3vh;opacity:.88}
 #dialogue{left:4vw;bottom:3vh}
}
</style></head><body>
<div id="scene">
 <div class="bg" id="bg"></div><div class="frost"></div>
 <img id="salem" src="../assets/salem_full.png" alt="Salem">
 <div class="vignette"></div><div id="flash"></div>
 <div id="break"></div>
 <div id="birthday"><h1>生日快乐，TT。</h1><p>HAPPY BIRTHDAY · WIDE AWAKE</p></div>
 <div id="dialogue"><div id="name">SALEM</div><div id="text"></div><div id="next">CLICK / ENTER</div></div>
 <div id="endui"><a href="../index.html">RESTART</a></div>
</div>
<script src="../js/state.js"></script>
<script>
ARG.flag("ending_birthday");
const bg=document.querySelector("#bg"), salem=document.querySelector("#salem"),
 box=document.querySelector("#dialogue"), text=document.querySelector("#text"),
 nameEl=document.querySelector("#name"), flash=document.querySelector("#flash"),
 birthday=document.querySelector("#birthday"), endui=document.querySelector("#endui"),
 scene=document.querySelector("#scene");

for(let i=0;i<72;i++){
 const s=document.createElement("i");s.className="snow";
 s.style.left=Math.random()*100+"vw";
 s.style.animationDuration=(5+Math.random()*8)+"s";
 s.style.animationDelay=(-Math.random()*10)+"s";
 s.style.setProperty("--drift",(-90+Math.random()*180)+"px");
 s.style.width=s.style.height=(2+Math.random()*5)+"px";
 s.style.opacity=.18+Math.random()*.58;scene.appendChild(s);
}
const lines=[
 ["PACEY","抹布。"],
 ["","门外安静了一秒。"],
 ["","然后传来了熟悉的爪子抓门声。"],
 ["PACEY","……找到你了。"],
 ["SALEM","终于。"],
 ["","你没有回头。可她的声音不再从镜子里传来。"],
 ["SALEM","能把自己骗到连自己都信，确实算本事。"],
 ["PACEY","你是在夸我？"],
 ["SALEM","我是在夸那条狗。"],
 ["PACEY","我就知道。"],
 ["SALEM","不过你现在应该明白了。你不是只能做到10%。"],
 ["SALEM","那是你自己写给自己的答案。既然答案是你写的——当然也可以不再回答它。"],
 ["","风声忽然变轻。雪原第一次不像梦，而像一场真的雪。"],
 ["SALEM","好了。到这里，金刀镇的事已经结束了。"],
 ["PACEY","听起来不像你的说话方式。"],
 ["SALEM","因为接下来这句，本来就不属于金刀镇。"],
 ["","Salem忽然转过脸。"],
 ["","她没有看Pacey。"],
 ["","她看向了屏幕。"],
 ["SALEM","看到这里的人，应该已经花了不少时间陪这个自恋的家伙在雪里绕圈子了吧。"],
 ["PACEY","喂。"],
 ["SALEM","安静。第四面墙一年也就拆这么一次。"],
 ["SALEM","Pacey Acaloi。今天不需要10%，也不需要100%。"],
 ["SALEM","不用证明什么，也不用再给自己下任何暗示。"],
 ["SALEM","只要好好记住今天就够了。"],
 ["SALEM","生日快乐，TT。"],
 ["SALEM","愿你醒着的时候，也能遇见足够多值得留下的好梦。"]
];
let idx=0, typing=false, timer=null, full="", char=0, finale=false;
function typeLine(){
 const [who,content]=lines[idx];nameEl.textContent=who||" ";
 full=content;char=0;text.textContent="";typing=true;
 clearInterval(timer);timer=setInterval(()=>{
   text.textContent=full.slice(0,++char);
   if(char>=full.length){clearInterval(timer);typing=false}
 },34);
 if(idx===17){flash.classList.remove("hit");void flash.offsetWidth;flash.classList.add("hit");scene.classList.add("glitch");setTimeout(()=>scene.classList.remove("glitch"),900)}
 if(idx===18){salem.classList.add("close")}
}
function advance(){
 if(finale)return;
 if(typing){clearInterval(timer);text.textContent=full;typing=false;return}
 if(idx<lines.length-1){idx++;typeLine();return}
 finale=true;box.classList.remove("on");
 bg.style.filter="brightness(.72) saturate(.92)";
 salem.style.opacity=".78";
 setTimeout(()=>birthday.classList.add("on"),700);
 setTimeout(()=>endui.classList.add("on"),3000);
}
document.addEventListener("click",advance);
document.addEventListener("keydown",e=>{if(["Enter","Space","ArrowRight"].includes(e.code)){e.preventDefault();advance()}});
setTimeout(()=>bg.classList.add("on"),150);
setTimeout(()=>salem.classList.add("on"),1150);
setTimeout(()=>{box.classList.add("on");typeLine()},2350);
</script></body></html>
