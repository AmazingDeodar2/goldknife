<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>宁格克口述传统摘录：冬季梦兆与北风禁忌</title><link rel="stylesheet" href="../css/site.css"></head><body><div class="site"><div class="cache">NORTHLAND CACHE // <a href="../archive.html" onclick="if(history.length>1){history.back();return false}">返回检索</a></div><header class="head"><h1>北境地方文化数字化项目</h1></header><main class="content"><h2>宁格克口述传统摘录：冬季梦兆与北风禁忌</h2><p>部分受访者反复描述一种冬季梦境：梦者站在没有道路、树木与日月的白色荒原，只能听见持续的风。</p><div class="quote">“那里没有方向。走得越久，就越觉得自己以前来过。”</div><p>整理者暂将该地点译作“风雪冷原”。几个互不相识的讲述者对地形的描述高度相似。</p><div class="note">扫描页背面据称有一幅铅笔草图：白色地平线上站着一个细小人影。图像未数字化。</div><p><b>你是在读到这份资料以前梦见那个地方的。</b></p><a class="back" href="../archive.html" onclick="if(history.length>1){history.back();return false}">← 返回缓存检索</a></main></div><script src="../js/state.js"></script><script>ARG.flag("folklore_seen")</script></body></html>
