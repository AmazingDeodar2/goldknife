<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>10/27 01:14</title><link rel="stylesheet" href="../css/site.css"></head><body><div class="site"><div class="cache">NORTHLAND CACHE // <a href="../archive.html" onclick="if(history.length>1){history.back();return false}">返回检索</a></div><header class="head"><h1>PACEY / LOCAL NOTES</h1></header><main class="content"><h2>10/27 01:14</h2><p>我还是记一下，免得明天觉得是自己脑补。</p><p>前三次全成功已经够奇怪了。第三个人更奇怪。</p><div class="transcript">P: 随便想一个安静的地方。

P: 附近有树吗？
E: 没有。

P: 房子或者路？
E: 没有。

P: 太阳？
