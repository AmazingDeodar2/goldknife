<!doctype html><html lang="zh-CN"><head>

  <script>
  const L=[["又是那片雪原。"], ["这一次，你很快发现自己不是一个人。"], ["一个红头发的女人站在十几步外。", 1], ["你看了她一会儿。", 1], ["她也看着你。", 1], ["最后还是你先开口。", 1], ["“看来我的梦终于开始尊重我的审美了。”", 1], ["她没有回答。", 1], ["“别这么看我。”", 1], ["“你突然出现在一个单身男人的梦里，总得允许他产生一点合理误会。”", 1], ["“你平时就是这么跟陌生女人说话的？”", 1], ["“一般不会。”", 1], ["你笑了一下。", 1], ["“一般她们会先告诉我名字。”", 1], ["女人看着你。", 1], ["“那你可以继续等。”", 1], ["“神秘型。”", 1], ["“也不错。”", 1], ["她像是懒得继续这个话题。", 1], ["“你最近碰过多少个人？”", 1], ["你挑了下眉。", 1], ["“这个问题范围很大。”", 1], ["“用你那个小把戏。”", 1], ["你脸上的笑意没有消失，只是淡了一点。", 1], ["“原来你喜欢先调查别人。”", 1], ["“五个？”", 1], ["你没回答。", 1], ["“还是六个？”", 1], ["“五个。”", 1], ["“都成功了？”", 1], ["“看来你调查得还挺仔细。”", 1], ["“回答。”", 1], ["你叹了口气。", 1], ["“是。”", 1], ["女人第一次真正皱起眉。", 1], ["“那你还有心情笑？”", 1], ["“我长成这样，皱眉比较浪费。”", 1], ["“放心。”", 1], ["“现在没人顾得上看你的脸。”", 1], ["“你这句话比刚才那些都吓人。”", 1], ["她看着你。", 1], ["“你觉得他们是被你催眠了？”", 1], ["“不然呢？”", 1], ["“你每次都这么确定自己在做什么？”", 1], ["“大部分时候。”", 1], ["“剩下的时候？”", 1], ["你想了想。", 1], ["“装得很确定。”", 1], ["她居然笑了一下。很短。", 1], ["“至少这一点你挺诚实。”", 1], ["“所以你准备告诉我发生了什么？”", 1], ["“不准备。”", 1], ["“那你专程跑进我的梦里，就是为了批评我的生活方式？”", 1], ["“这是你的梦？”", 1], ["她看向四周。", 1], ["“你确定？”", 1], ["你也看了一眼雪原。", 1], ["“如果是我的，布景确实差了点。”", 1], ["“那就想想。”", 1], ["“你最近到底把什么东西当成了自己的。”", 1], ["你还想追问，她却忽然偏过头。", 1], ["“还有。”", 1], ["“醒醒。”", 1], ["“这么快？我连名字都还没——”", 1], ["“你的狗快把你脸舔破了。”", 1], ["“……”", 1], ["你下意识低头。", 1], ["“你认识抹布？”", 1], ["她已经开始后退。", 1], ["“不认识。”", 1], ["“它比你好懂。”", 1], ["“喂——”", 1], ["雪原骤然远去。"]];
  const SALEM_LINES=["“不准备。”", "“不认识。”", "“五个？”", "“你平时就是这么跟陌生女人说话的？”", "“你最近到底把什么东西当成了自己的。”", "“你最近碰过多少个人？”", "“你每次都这么确定自己在做什么？”", "“你的狗快把你脸舔破了。”", "“你确定？”", "“你觉得他们是被你催眠了？”", "“剩下的时候？”", "“回答。”", "“它比你好懂。”", "“放心。”", "“现在没人顾得上看你的脸。”", "“用你那个小把戏。”", "“至少这一点你挺诚实。”", "“还是六个？”", "“还有。”", "“这是你的梦？”", "“那你可以继续等。”", "“那你还有心情笑？”", "“那就想想。”", "“都成功了？”", "“醒醒。”"];
  let i=0,t=document.querySelector("#text"),f=document.querySelector("#fig");
  function r(){
   let x=L[i],line=x[0];
   t.textContent=line; f.className=x[1]?"figure":"";
   t.classList.remove("speaker-pacey","speaker-salem","speaker-narration");
   const isDialogue=/^“.*”$/.test(line);
   if(!isDialogue)t.classList.add("speaker-narration");
   else if(SALEM_LINES.includes(line))t.classList.add("speaker-salem");
   else t.classList.add("speaker-pacey");
  }
  function n(){
   if(i>=L.length-1){
     ARG.flag("dream02_seen");
     location.href="../story/postdream02.html";
   }else{i++;r()}
  }
  document.addEventListener("click",n);
  document.addEventListener("keydown",e=>{if(["Space","Enter","ArrowRight"].includes(e.code)){e.preventDefault();n()}});
  r();
  </script></body></html>
