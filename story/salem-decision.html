<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../css/story.css"><title>Salem</title></head><body><main class="story"><div class="chapter">10 / 29 — 02:31</div><p>Salem。</p><p>你把名字念了一遍。抹布从床尾抬头看你。</p><p>“不是叫你。”</p><p>一个 1978 年的猎人见过她。2007 年有人见过她。2022 年也有人见过她。</p><p>如果记录说的是同一个人，问题已经不是她存不存在，而是她到底在这里多久了。</p><p>更糟的是，你现在知道一个可能在梦里把她叫出来的名字。</p><div class="choice"><a href="../dream/dream03.html">睡觉 →</a></div></main><script src="../js/state.js"></script><script>ARG.flag("salem_decision_seen")</script></body></html>
