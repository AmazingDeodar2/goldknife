<p>你盯着那句“10%够了”看了很久。</p>
<div class="dialogue">“所以……我以前觉得自己太厉害？”</div>
<p>你重新看了一遍。</p>
<div class="dialogue">“这确实很像我会写出来的东西。”</div>
<p>又看了一遍。</p>
<div class="dialogue">“但‘为了安全限制自己’不太像。”</div>
<p>抹布叫了一声。</p>
<div class="dialogue">“谢谢，我知道你不同意。”</div>
<p>你甚至怀疑这些东西是不是 Salem 塞进来的。</p>
<p>但文件路径、修改时间、甚至你自己那些令人讨厌的备注习惯都对得上。</p>
