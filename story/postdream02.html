<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../css/story.css"><title>醒来以后</title></head><body><main class="story"><div class="chapter">10 / 29 — 01:16</div><p>抹布从你胸口跳下去以后，你坐在床边清醒了好一会儿。</p><p>门下面没有水。很好。至少今晚没有。</p><p>但那个女人显然知道你是谁，知道你这几天做了什么，甚至知道现实里的抹布正在舔你。</p><div class="dialogue">“你以为那是催眠？”<br><br>“难怪你能把门开成这样。”</div><p>旅游网站上的“红发女巫”多半是胡扯。可如果她真的一直在这里，总该有人在更早以前见过她。</p><p>你重新打开缓存站，决定不再搜“女巫”，而是搜更普通的词：红发女人、北林、目击、搜救。</p><div class="choice"><a href="../archive.html">继续调查 →</a></div></main><script src="../js/state.js"></script><script>ARG.flag("postdream02_seen")</script></body></html>
